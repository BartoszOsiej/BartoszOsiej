<radialGradient id="dot"><stop offset="0" stop-color="#fff"/><stop offset="0.4" stop-color="#0969da"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></radialGradient>
<path id="flowpath" d="M70,96 H810"/>
</defs>
<rect width="880" height="150" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<text x="22" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#1f2328">EVERY RELEASE, VERIFIED</text>
<text x="858" y="32" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#656d76">git tag -&gt; CI -&gt; signed images -&gt; registries</text>
