name: Profile Stats

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVG
        run: |
          cat > out/stats-card.svg << 'SVGEOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#0d1117"/>
                <stop offset="100%" style="stop-color:#161b22"/>
              </linearGradient>
              <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#7c3aed"/>
                <stop offset="100%" style="stop-color:#3b82f6"/>
              </linearGradient>
            </defs>
            <rect width="480" height="200" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>
            <text x="240" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Bartosz Osiej — By The Numbers</text>
            <rect x="30" y="60" width="90" height="60" rx="8" fill="#1f6feb" opacity="0.15"/>
            <text x="75" y="85" font-family="monospace" font-size="24" font-weight="bold" fill="#58a6ff" text-anchor="middle">9</text>
            <text x="75" y="108" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">Repos</text>
            <rect x="140" y="60" width="90" height="60" rx="8" fill="#238636" opacity="0.15"/>
            <text x="185" y="85" font-family="monospace" font-size="24" font-weight="bold" fill="#3fb950" text-anchor="middle">6</text>
            <text x="185" y="108" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">npm</text>
            <rect x="250" y="60" width="90" height="60" rx="8" fill="#da3633" opacity="0.15"/>
            <text x="295" y="85" font-family="monospace" font-size="24" font-weight="bold" fill="#f85149" text-anchor="middle">6</text>
            <text x="295" y="108" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">crates</text>
            <rect x="360" y="60" width="90" height="60" rx="8" fill="#8957e5" opacity="0.15"/>
            <text x="405" y="85" font-family="monospace" font-size="24" font-weight="bold" fill="#bc8cff" text-anchor="middle">2</text>
            <text x="405" y="108" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">PyPI</text>
            <text x="240" y="160" font-family="monospace" font-size="12" fill="#484f58" text-anchor="middle">192 tests · 30+ releases · 9 Docker images · OpenSSF Scorecard</text>
            <text x="240" y="185" font-family="monospace" font-size="11" fill="#484f58" text-anchor="middle">Updated weekly by GitHub Actions</text>
          </svg>
          SVGEOF
          echo "Stats card generated"

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out/stats-card.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update profile stats card [skip ci]"
            git push
          fi
