name: stats-engine

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Restore rolling history from stats branch
        run: |
          mkdir -p out
          for f in history.json views.json; do
            curl -fsSL "https://raw.githubusercontent.com/BartoszOsiej/BartoszOsiej/stats/svg/$f" -o "out/$f" || true
          done

      - name: Render live metrics (npm / PyPI / crates.io / GitHub)
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Publish to stats branch
        run: |
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mv out /tmp/stats-out

          if git ls-remote --exit-code --heads origin stats >/dev/null 2>&1; then
            git fetch --depth 1 origin stats
            git checkout -B stats origin/stats
          else
            git checkout --orphan stats
          fi
          git rm -rf --cached . -q 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          mv /tmp/stats-out out
          mkdir -p svg
          cp out/metrics-dark.svg out/metrics-light.svg out/meta.json out/history.json \
             out/views-dark.svg out/views-light.svg out/views.json svg/

          git add svg/
          git commit -m "stats: refresh $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "no changes"
          git push origin stats
