name: stats-engine

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-engine
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Restore rolling history from stats branch
        run: |
          mkdir -p out
          for f in history.json views.json; do
            curl -fsSL "https://raw.githubusercontent.com/BartoszOsiej/BartoszOsiej/stats/svg/$f" -o "out/$f" || true
          done

      - name: Render live metrics (npm / PyPI / crates.io / GitHub)
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Render animated widgets (terminal / dashboard / trophy / pipeline)
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/widgets.py

      - name: Publish to stats branch
        run: |
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mv out /tmp/stats-out

          if git ls-remote --exit-code --heads origin stats >/dev/null 2>&1; then
            git fetch --depth 1 origin stats
            git checkout -B stats origin/stats
          else
            git checkout --orphan stats
          fi
          git rm -rf --cached . -q 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          mv /tmp/stats-out out
          mkdir -p svg
          cp out/metrics-dark.svg out/metrics-light.svg out/meta.json out/history.json \
             out/views-dark.svg out/views-light.svg out/views.json svg/
          cp out/terminal-dark.svg out/terminal-light.svg \
             out/dashboard-dark.svg out/dashboard-light.svg \
             out/achievements-dark.svg out/achievements-light.svg \
             out/pipeline-dark.svg out/pipeline-light.svg \
             out/banner-dark.svg out/banner-light.svg \
             out/divider-dark.svg out/divider-light.svg \
             out/rule-dark.svg out/rule-light.svg \
             out/typing-dark.svg out/typing-light.svg \
             out/stats-dark.svg out/stats-light.svg \
             out/langs-dark.svg out/langs-light.svg \
             out/streak-dark.svg out/streak-light.svg \
             out/heatmap-dark.svg out/heatmap-light.svg \
             out/clock-dark.svg out/clock-light.svg \
             out/bounce-dark.svg out/bounce-light.svg \
             out/matrix-dark.svg out/matrix-light.svg \
             out/life-dark.svg out/life-light.svg \
             out/radar-dark.svg out/radar-light.svg \
             out/equalizer-dark.svg out/equalizer-light.svg \
             out/stars-dark.svg out/stars-light.svg \
             out/guestbook-dark.svg out/guestbook-light.svg svg/
          cp out/stars.json svg/ 2>/dev/null || true

          git add svg/
          git commit -m "stats: refresh $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "no changes"
          git push origin stats
